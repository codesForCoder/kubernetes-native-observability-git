server:
  extraArgs:
    web.enable-lifecycle: "true" # Enables the /-/reload HTTP endpoint
  service:
    type: ClusterIP
  persistentVolume:
    enabled: true
    size: 10Gi

# Disable resource-heavy components not needed for basic OTLP metrics ingestion
alertmanager:
  enabled: false
pushgateway:
  enabled: false
nodeExporter:
  enabled: false
kubeStateMetrics:
  enabled: false