grafana:
  enabled: false

prometheus:
  enabled: true
  prometheusSpec:
    enableRemoteWriteReceiver: true
    retention: 3d
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 2Gi
        cpu: 1000m

alertmanager:
  enabled: true

prometheusOperator:
  enabled: true

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true