apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: app-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:4.0.0
          imagePullPolicy: IfNotPresent
          # ports:
          #   - name: broker
          #     containerPort: 9092
          ports:
            - name: internal
              containerPort: 9092
            - name: external
              containerPort: 29092
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            # - name: KAFKA_LISTENERS
            #   value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_LISTENERS
              value: "INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093"
            # - name: KAFKA_ADVERTISED_LISTENERS
            #   value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "INTERNAL://kafka.app-data.svc.cluster.local:9092,EXTERNAL://localhost:29092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            # - name: KAFKA_INTER_BROKER_LISTENER_NAME
            #   value: "PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "INTERNAL"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"

---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: app-data
spec:
  selector:
    app: kafka
  ports:
    - name: internal
      port: 9092
      targetPort: 9092

    - name: external
      port: 29092
      targetPort: 29092
  type: ClusterIP

---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-create-topics
  namespace: app-data
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-topics
          image: apache/kafka:4.0.0
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Kafka..."

              until /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server kafka:9092 \
                --list >/dev/null 2>&1
              do
                sleep 2
              done

              echo "Kafka is ready."

              /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server kafka:9092 \
                --create \
                --if-not-exists \
                --topic app-events \
                --partitions 1 \
                --replication-factor 1

              echo "Topic app-events is ready."
