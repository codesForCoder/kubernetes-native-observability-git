apiVersion: v1
kind: Namespace
metadata:
  name: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-frontend
  namespace: frontend
  labels:
    app: observability-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: observability-frontend
  template:
    metadata:
      labels:
        app: observability-frontend
    spec:
      containers:
        - name: nginx
          image: aniket1992/observability-frontend:1.7
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: observability-frontend
  namespace: frontend
spec:
  type: ClusterIP
  selector:
    app: observability-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
