apiVersion: v1
kind: Namespace
metadata:
  name: go-app

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-rest-api
  namespace: go-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-rest-api
  template:
    metadata:
      labels:
        app: go-rest-api
    spec:
      containers:
        - name: go-rest-api
          image: aniket1992/go-rest-api:1.3
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8084

          env:
            - name: DB_USER
              value: "appuser"

            - name: DB_PASSWORD
              value: "apppassword"

            - name: DB_NAME
              value: "appdb"

            - name: DB_HOST
              value: "postgres.app-data.svc.cluster.local"

            - name: DB_PORT
              value: "5432"

            - name: OTEL_SERVICE_NAME
              value: "go-rest-api"

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "o2c-openobserve-collector-gateway-collector.openobserve-collector.svc.cluster.local:4318"

---
apiVersion: v1
kind: Service
metadata:
  name: go-rest-api
  namespace: go-app
spec:
  selector:
    app: go-rest-api
  ports:
    - port: 8084
      targetPort: 8084
      protocol: TCP
  type: ClusterIP
